# Executor. Runs as monitor-executor (patch deployments in allowlisted namespaces only) and
# only the API may talk to it (NetworkPolicy; enforced by CNIs that support it, not kindnet).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  namespace: k8s-ai-monitor
  labels: { app.kubernetes.io/name: executor, app.kubernetes.io/part-of: k8s-ai-monitor }
spec:
  replicas: 1 # its single-use approval store is local SQLite
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: executor }
  template:
    metadata:
      labels: { app.kubernetes.io/name: executor, app.kubernetes.io/part-of: k8s-ai-monitor }
    spec:
      serviceAccountName: monitor-executor
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: executor
          image: k8s-ai-monitor/backend:dev
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.executor.service:create_app", "--factory",
                    "--host", "0.0.0.0", "--port", "8001"]
          ports: [{ name: http, containerPort: 8001 }]
          env:
            - { name: PORT, value: "8001" }
            - { name: EXECUTOR_ALLOWED_NAMESPACES, value: demo }
            - name: EXECUTOR_API_KEY
              valueFrom: { secretKeyRef: { name: k8s-ai-monitor-secrets, key: EXECUTOR_API_KEY } }
            - name: APPROVAL_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: k8s-ai-monitor-secrets, key: APPROVAL_SIGNING_KEY }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: executor
  namespace: k8s-ai-monitor
  labels: { app.kubernetes.io/name: executor }
spec:
  selector: { app.kubernetes.io/name: executor }
  ports: [{ name: http, port: 8001, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: executor-from-api-only
  namespace: k8s-ai-monitor
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: executor }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: api }
      ports: [{ port: 8001 }]
