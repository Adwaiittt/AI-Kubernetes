# Identity used by the investigating agent. READ-ONLY by construction:
#   * a namespaced Role (no ClusterRole, no ClusterRoleBinding)
#   * verbs limited to get/list/watch
#   * no secrets, configmaps, or any write subresource
# tests/unit/test_rbac_manifests.py enforces all of the above.
#
# To monitor another namespace, apply the Role + RoleBinding below with metadata.namespace
# changed (the chaos benchmark does this for each scenario namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitor-reader
  namespace: k8s-ai-monitor
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitor-reader
  namespace: demo
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitor-reader
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: monitor-reader
    namespace: k8s-ai-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: monitor-reader
