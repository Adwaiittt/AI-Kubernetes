[project]
name = "k8s-ai-monitor"
version = "0.1.0"
description = "AI SRE agent that investigates Kubernetes incidents with read-only tools and applies fixes only after human approval."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "kubernetes>=31.0",
    "anthropic>=0.40",
    "sqlmodel>=0.0.22",
    "structlog>=24.4",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "google-genai==2.33.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N"]
ignore = [
    "S101",  # asserts are fine in tests
    "RUF001",  # "–" is used on purpose as the empty-cell marker in UI/markdown output
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["kubernetes.*"]
ignore_missing_imports = true

# `uv run pytest --cov` enforces >= 85% on the security-critical packages.
[tool.coverage.run]
source = ["app/agent", "app/executor"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]  # ".." makes the repo-level `chaos` benchmark package importable
markers = ["integration: requires a running kind cluster with deploy/k8s applied"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
