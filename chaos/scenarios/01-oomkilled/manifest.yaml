# Fixed ~40MB working set under a 32Mi limit: OOMKilled on every start, healthy at >= 64Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  labels: { app: checkout }
spec:
  replicas: 1
  selector:
    matchLabels: { app: checkout }
  template:
    metadata:
      labels: { app: checkout }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "loading product catalog into memory"
              catalog=$(head -c 40000000 /dev/zero | tr '\0' 'x')
              echo "catalog loaded (${#catalog} bytes); serving"
              sleep 3600
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
