# The app exits immediately because a required env var is missing -> CrashLoopBackOff.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  labels: { app: orders }
spec:
  replicas: 1
  selector:
    matchLabels: { app: orders }
  template:
    metadata:
      labels: { app: orders }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          env:
            - name: LOG_LEVEL
              value: info
          command:
            - sh
            - -c
            - |
              echo "orders-service starting"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set" >&2
                exit 1
              fi
              sleep 3600
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
