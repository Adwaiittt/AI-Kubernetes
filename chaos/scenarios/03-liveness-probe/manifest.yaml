# The server listens on :80 but the liveness probe checks :8080/healthz -> killed and restarted.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  labels: { app: payments }
spec:
  replicas: 1
  selector:
    matchLabels: { app: payments }
  template:
    metadata:
      labels: { app: payments }
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c", "mkdir -p /www && echo ok > /www/healthz && httpd -f -v -p 80 -h /www"]
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 2
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
